# Bootstraps the toolchain and is the one entry point: `mise run <task>`, the same task names in every nullean repo.
# The .NET SDK version lives only in global.json: the first dotnet entry reads it from there (sdk.version is the first
# "version" key). List further runtimes after it when tests run on older target frameworks too.

[env]
DOTNET_NOLOGO = "1"
DOTNET_CLI_TELEMETRY_OPTOUT = "1"
DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"

[tools]
dotnet = ["""{{ read_file(path='global.json') | split(pat='"version"') | nth(n=1) | split(pat='"') | nth(n=1) }}""", "10"]
gh = "latest"
zizmor = "1"

[tasks.setup]
description = "Restore the local .NET tools"
run = "dotnet tool restore"

[tasks.build]
description = "Build the solution"
depends = ["setup"]
run = "dotnet run --project build/scripts -- build"

[tasks.test]
description = "Build, then run the tests"
depends = ["setup"]
run = "dotnet run --project build/scripts -- test"

[tasks.check]
description = "Fail on workflow findings (zizmor)"
run = "zizmor --min-severity medium ."

[tasks.pack]
description = "Build, pack the NuGet packages, validate them and report public API changes"
depends = ["setup"]
run = "dotnet run --project build/scripts -- pack"

[tasks.clean]
description = "Delete build output"
run = "dotnet run --project build/scripts -- clean"

[tasks.ci]
description = "Exactly what CI runs on every push: test, then pack"
depends = ["setup"]
run = "dotnet run --project build/scripts -- ci"
