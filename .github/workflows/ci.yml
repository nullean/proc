name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: nullean/.github/.github/workflows/dotnet-ci.yml@f6c87e1598a3e21ae0404577cadd975783f79579 # v1.0.0
    permissions:
      contents: read
    with:
      # Windows: a test run can still hold Proc.Tests.Binary.exe while the next target framework republishes it
      os: '["ubuntu-latest", "macos-latest"]'
      packages-path: build/output

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@f6c87e1598a3e21ae0404577cadd975783f79579 # v1.0.0
    permissions:
      contents: read

  # every push to main publishes a canary build to GitHub Packages
  canary:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          until dotnet nuget push 'packages/*.nupkg' -k "$GITHUB_TOKEN" \
            -s https://nuget.pkg.github.com/nullean/index.json --skip-duplicate --no-symbols; do
            echo "Retrying"; sleep 1
          done
