name: ci

# nuget.org's trusted publishing policies name this file, so releasing happens here too: publishing the
# release-drafter draft (web UI or phone) fires `release: published`, and the release job below runs on it.
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    uses: nullean/.github/.github/workflows/dotnet-ci.yml@83ef343759c443afe1964e9c33327527f8677b05 # v1.3.0
    permissions:
      contents: read
    with:
      # Windows: a test run can still hold Proc.Tests.Binary.exe while the next target framework republishes it
      os: '["ubuntu-latest", "macos-latest"]'
      packages-path: build/output

  zizmor:
    uses: nullean/.github/.github/workflows/zizmor.yml@83ef343759c443afe1964e9c33327527f8677b05 # v1.3.0
    permissions:
      contents: read

  # every push to main publishes a canary build to GitHub Packages
  canary:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: packages
      - name: Push to GitHub Packages
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          until dotnet nuget push 'packages/*.nupkg' -k "$GITHUB_TOKEN" \
            -s https://nuget.pkg.github.com/nullean/index.json --skip-duplicate --no-symbols; do
            echo "Retrying"; sleep 1
          done

  # packs at the release's tag in the shared workflow...
  release:
    if: github.event_name == 'release'
    needs: [build, zizmor]
    uses: nullean/.github/.github/workflows/release.yml@2454f9081f3c06f5533805afa8f44e6bb67c39c5 # v1.4.0
    permissions:
      contents: write
    with:
      packages-path: build/output

  # ...and publishes from this file: nuget.org's trusted publishing checks that the token's workflow is this ci.yml,
  # which a job inside the shared workflow would not be.
  publish:
    if: github.event_name == 'release'
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # append the public API changes to the release notes
      id-token: write # NuGet trusted publishing: exchange the OIDC token for a short-lived key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-packages
          path: packages
      - uses: nullean/.github/actions/nuget-publish@2454f9081f3c06f5533805afa8f44e6bb67c39c5 # v1.4.0
        with:
          user: ${{ secrets.NUGET_USER }}
          packages-path: packages
